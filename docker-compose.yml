services:

  prefect-server:
    # Pinada por versão + digest (capturado em 22/09/2026), coerente com o
    # client (prefect==3.8.0 no requirements.txt do pipeline) — mismatch de
    # versão entre server/client do Prefect pode quebrar a API.
    # ":3-latest" muda sob os pés.
    image: prefecthq/prefect:3.8.0-python3.11@sha256:336db9a11969f074fb5d8d690d5c80c9ea227fbd73ead8523de22e10f9b34d30
    container_name: prefect-server
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////prefect/prefect.db
      PREFECT_UI_API_URL: http://${PREFECT_HOST:-localhost}:4200/api
    volumes:
      - prefect_data:/prefect
    ports:
      - "4200:4200"
    mem_limit: 1g

  pipeline:
    build:
      context: ./pipeline
    container_name: pipeline
    restart: unless-stopped
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      # Alertas (F11) — opcionais; vazio = sem alerta (o flow avisa no log).
      NTFY_URL: ${NTFY_URL:-}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
    volumes:
      - ./data:/data
      - ./dbt:/dbt
    depends_on:
      - prefect-server
    mem_limit: 1.5g

volumes:
  prefect_data:
