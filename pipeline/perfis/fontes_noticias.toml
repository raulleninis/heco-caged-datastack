# Fontes de notícias do boletim com IA (F19 parte 4). Arquivo da INSTÂNCIA: sai do produto na
# separação (F18). Só feeds RSS/Atom: sites sem feed exigiriam ler HTML, que quebra quando o
# site muda (avaliado em 29/09/2026: Observatório FIES e Fecomércio SE não têm feed; a lista
# da Prefeitura de Socorro é montada por JavaScript).
#
# escala: municipal | regional | estadual | nacional (o boletim nunca usa estadual ou nacional
# como explicação direta do município; roteiro, seção 4).
# intervalo_s: espera mínima entre requisições ao mesmo host (robots.txt da Faxaju pede 10 s).
#
# Os feeds guardam poucas notícias (a Infonet, 10 em ~2 dias): por isso a coleta é DIÁRIA.

# O feed da editoria "economia e política" só trazia conteúdo de OUTROS estados (19 de 19 itens
# em sc., es., pa., df.agenciasebrae...; verificado em 29/09/2026). O feed geral do site de SE
# traz conteúdo de Sergipe. O nome fica igual para a exclusão valer também para o já coletado.
# excluir_links: regex sobre o link; usado na seleção das evidências (flows/evidencias.py).
[[fontes]]
nome = "Agência Sebrae SE: economia e política"
feed = "https://se.agenciasebrae.com.br/feed/"
escala = "estadual"
intervalo_s = 2
excluir_links = '^https?://(?!se\.)[a-z]{2}\.agenciasebrae\.com\.br'


[[fontes]]
nome = "Faxaju: economia"
feed = "https://www.faxaju.com.br/categoria/economia/feed/"
escala = "regional"
intervalo_s = 10

[[fontes]]
nome = "Infonet: economia"
feed = "https://infonet.com.br/categoria/noticias/economia/feed/"
escala = "regional"
intervalo_s = 2

[[fontes]]
nome = "InfoMoney: comércio exterior"
feed = "https://www.infomoney.com.br/tudo-sobre/comercio-exterior/feed/"
escala = "nacional"
intervalo_s = 2

# Acrescentadas em 29/09/2026. O g1 geral ficou de fora: 100 notícias em 3,5 horas, nacional e
# de todos os temas, ruído que nem a coleta diária acompanha.
[[fontes]]
nome = "g1 Sergipe"
feed = "https://g1.globo.com/dynamo/se/sergipe/rss2.xml"
escala = "estadual"
intervalo_s = 2

[[fontes]]
nome = "g1 Economia"
feed = "https://g1.globo.com/dynamo/economia/rss2.xml"
escala = "nacional"
intervalo_s = 2

# Google News (busca RSS) avaliado e RECUSADO em 29/09/2026: o robots.txt do news.google.com
# proíbe robôs em todo o site (User-agent: * / Disallow: /), com bloqueio explícito a robôs de
# IA. O coletor respeita o robots.txt; não contornar. O suporte a agregador (agregador = true:
# "Título - Veículo") continua no coletor para outra fonte do tipo.
