version: 2

models:
  - name: stg_caged_movimentacoes
    description: "Movimentações (admissões/desligamentos) do Novo CAGED, filtradas para Nossa Senhora do Socorro/SE."
    columns:
      - name: competencia_mov
        tests:
          - not_null
      - name: uf
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [28]
      - name: municipio
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [280480]
      - name: saldo_movimentacao
        description: "1 = admissão, -1 = desligamento. Todo o mart depende deste contrato — qualquer outro valor (0, 2, NULL) quebra admissoes/desligamentos/saldo_liquido silenciosamente."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, -1]
      - name: unidade_salario_codigo
        description: >
          Unidade do salário declarado (1=hora, 2=dia, 3=semana, 4=quinzena,
          5=mês, 6=tarefa, conforme layout do Novo CAGED). 7 e 99 também
          aparecem nos dados reais (validado em runtime, 22/09/2026,
          competências 202601-202607) — 7 sempre com valor_salario_fixo=0
          (parece "não informado"); 99 majoritariamente 0, mas 2 registros
          com valor não-zero (inconsistência da fonte declaratória, não
          investigada a fundo). Nenhum dos dois afeta o mart: as métricas
          de salário filtram só código 5, então 7/99 são excluídos de
          qualquer forma. As métricas de salário do mart filtram só código
          5 (mensal) — um código REALMENTE novo na fonte (fora desta lista)
          deve ser detectado aqui, não silenciosamente ignorado ou misturado.
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 99]
      - name: grupamento
        description: "Nível 1 da Tabela 1 do MTE (Grupamentos de Atividades Econômicas para divulgação da RAIS e do CAGED), por seção da CNAE 2.0."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Agropecuária', 'Indústria', 'Construção', 'Comércio', 'Serviços', 'Não Identificado']
      - name: subgrupamento
        description: "Nível 2 da mesma Tabela 1 do MTE — abre Indústria e Serviços em subcategorias."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Agropecuária'
                  - 'Indústria geral'
                  - 'Indústrias de Transformação'
                  - 'Construção'
                  - 'Comércio, reparação de veículos automotores e motocicletas'
                  - 'Transporte, armazenagem e correio'
                  - 'Alojamento e alimentação'
                  - 'Informação, comunicação e atividades financeiras, imobiliárias, profissionais e administrativas'
                  - 'Administração pública, defesa, seguridade social, educação, saúde humana e serviços sociais'
                  - 'Outros serviços'
                  - 'Serviços domésticos'
                  - 'Não Identificado'
