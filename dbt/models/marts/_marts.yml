version: 2

models:
  - name: mart_caged_mensal_grupamento
    description: "Admissões, desligamentos, saldo líquido e métricas de salário mensal do CAGED por competência e grupamento."
    columns:
      - name: competencia_mov
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_caged_movimentacoes')
                field: competencia_mov
      - name: grupamento
        tests:
          - not_null
      - name: admissoes
        description: "Contagem de admissões (saldo_movimentacao = 1)"
        tests:
          - not_null
      - name: desligamentos
        description: "Contagem de desligamentos (saldo_movimentacao = -1)"
        tests:
          - not_null
      - name: saldo_liquido
        description: "Admissões menos desligamentos"
        tests:
          - not_null
      - name: admissoes_com_salario_valido
        description: "Base do cálculo: admissões com unidade_salario_codigo=5 (mensal) e valor > 0"
      - name: salario_mediano_admissao
        description: "Salário mensal mediano na admissão (métrica robusta a outlier). NULL se 0 registros com salário válido."
      - name: salario_medio_admissao
        description: "Salário mensal médio na admissão (para comparação com mediana, mostra concentração). NULL se 0 registros com salário válido."
      - name: palma_index_admissao
        description: "Índice de desigualdade: média dos salários do top 10% dividida pela média dos salários do bottom 40%. Interpretação: Palma > 1 indica desigualdade (10% mais ricos ganham mais que os 40% mais pobres). NULL se insuficientes registros."

  - name: mart_caged_reconciliado
    description: >
      Saldo por competência de movimentação e grupamento reconciliado: MOV + FOR (fora do prazo)
      - EXC (exclusões). `situacao` distingue número provisório (ainda pode receber declarações
      fora do prazo) de consolidado (só exclusões tardias podem mexer). Salários ficam no
      mart_caged_mensal_grupamento. Ver F12 e D11.
    columns:
      - name: competencia_mov
        tests:
          - not_null
      - name: grupamento
        tests:
          - not_null
      - name: saldo_mov
        description: "Saldo só-MOV (declarado dentro do prazo). Deve bater com mart_caged_mensal_grupamento.saldo_liquido."
      - name: saldo_fora_prazo
        description: "Efeito do CAGEDFOR no saldo (soma)."
      - name: saldo_exclusoes
        description: "Efeito do CAGEDEXC no saldo: NEGATIVO quando uma admissão é excluída (o arquivo traz +1; aqui já vem invertido)."
      - name: saldo_consolidado
        description: "saldo_mov + saldo_fora_prazo + saldo_exclusoes."
      - name: defasagem_meses
        description: "Meses entre esta competência e a última competência carregada (ultima_competencia_carregada)."
      - name: situacao
        description: "'provisório' se defasagem_meses < meses_para_consolidar (padrão 12); senão 'consolidado' (não é imutável: exclusões tardias)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['provisório', 'consolidado']

  - name: mart_estoque
    description: >
      Estoque de emprego e taxa de variação mensal por território × grupamento × competência
      (F20/D11), ancorado no estoque de referência do MTE (o mesmo que o painel usa): para trás
      e para frente da competência da referência, com o saldo reconciliado. Estoque e taxa ficam
      NULL antes de var('estoque_inicio') (202001) e em território sem referência; o saldo existe sempre.
    columns:
      - name: territorio
        tests:
          - not_null
      - name: grupamento
        tests:
          - not_null
      - name: competencia_mov
        tests:
          - not_null
      - name: saldo_consolidado
        description: "MOV + FOR − EXC da competência. Coincide com mart_caged_reconciliado.saldo_consolidado."
        tests:
          - not_null
      - name: estoque
        description: "referência ± saldos entre a competência e a da referência. NULL sem referência (ou antes de estoque_inicio)."
      - name: taxa_variacao_mensal
        description: "saldo_consolidado ÷ estoque do mês anterior (fração). NULL sem estoque anterior ou com estoque 0."
      - name: competencia_referencia
        description: "Competência do estoque de referência do território (NULL se não houver)."

  - name: mart_fluxo
    description: >
      F19 parte 1. Admissões, desligamentos e saldo reconciliados (MOV + FOR − EXC) por
      território × competência × grupamento × subgrupamento × divisão CNAE (2 dígitos), para
      os territórios ativos. Mesma regra do estoque (efeito_no_saldo): somado por grupamento,
      é o saldo do mart_estoque. Base setorial do boletim com IA; nunca desce a subclasse.
    columns:
      - name: territorio
        tests: [not_null]
      - name: competencia_mov
        tests: [not_null]
      - name: grupamento
        tests: [not_null]
      - name: divisao_cnae
        description: "2 dígitos da CNAE 2.0; 'NI' = subclasse não identificada (9999999)"
        tests: [not_null]

  - name: mart_perfil_movimentacoes
    description: >
      F19 parte 1. Movimentações reconciliadas por território × competência, em duas
      dimensões independentes (sexo; faixa etária). As categorias de cada dimensão somam o
      total do mart_fluxo (test_perfil_confere_fluxo).
    columns:
      - name: dimensao
        tests:
          - accepted_values:
              arguments:
                values: ['sexo', 'faixa_etaria']
      - name: categoria
        tests: [not_null]

  - name: mart_estoque_regiao
    description: >
      F19 parte 1. Estoque e taxa de cada região de seeds/regioes.csv, como soma dos
      municípios membros no mart_estoque. Estoque NULL quando algum membro não tem estoque na
      competência (sem estoque parcial com cara de completo).

  - name: mart_salario_admissao
    description: >
      F19 parte 1. Salário de admissão (mediana e média) por território × competência, com
      as regras da D05 (só MOV, mensal, valor > 0). Mediana calculada sobre os registros, não
      a partir das medianas por grupamento.

unit_tests:
  - name: exclusao_de_admissao_reduz_estoque
    description: >
      Critérios 6 da F16 e da F20. Referência de 101 ao fim de 202004; em 202004 duas
      admissões no MOV e a exclusão de uma admissão (o EXC traz +1, o efeito é −1): saldo 1.
      Recuando, 202003 = 101 − 1 = 100 e 202002 = 100 − 1 = 99 (o saldo de 202003). Sem a
      exclusão, o saldo de 202004 seria 2 e 202003 daria 99.
    model: mart_estoque
    given:
      - input: ref('territorios')
        rows:
          - {territorio: '280480', nome: 'Nossa Senhora do Socorro', tipo: 'municipio', ativo: true}
      - input: ref('stg_estoque_referencia')
        rows:
          - {competencia_referencia: 202004, codmun: '280480', uf: '28', grupamento: 'Indústria', estoque: 101}
      - input: ref('stg_caged_movimentacoes')
        rows:
          - {uf: 28, municipio: 280480, grupamento: 'Indústria', competencia_mov: 202003, saldo_movimentacao: 1}
          - {uf: 28, municipio: 280480, grupamento: 'Indústria', competencia_mov: 202004, saldo_movimentacao: 1}
          - {uf: 28, municipio: 280480, grupamento: 'Indústria', competencia_mov: 202004, saldo_movimentacao: 1}
      - input: ref('stg_caged_fora_do_prazo')
        rows: []
      - input: ref('stg_caged_exclusoes')
        rows:
          - {uf: 28, municipio: 280480, grupamento: 'Indústria', competencia_mov: 202004, competencia_arquivo: 202605, saldo_movimentacao: 1}
    expect:
      rows:
        - {territorio: '280480', grupamento: 'Agropecuária', competencia_mov: 202001, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Agropecuária', competencia_mov: 202002, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Agropecuária', competencia_mov: 202003, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Agropecuária', competencia_mov: 202004, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Comércio', competencia_mov: 202001, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Comércio', competencia_mov: 202002, saldo_consolidado: 0, estoque: 0}
