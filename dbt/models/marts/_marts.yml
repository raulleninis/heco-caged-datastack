version: 2

models:
  - name: mart_caged_mensal_grupamento
    description: "Admissões, desligamentos, saldo líquido e métricas de salário mensal do CAGED por competência e grupamento."
    columns:
      - name: competencia_mov
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_caged_movimentacoes')
                field: competencia_mov
      - name: grupamento
        tests:
          - not_null
      - name: admissoes
        description: "Contagem de admissões (saldo_movimentacao = 1)"
        tests:
          - not_null
      - name: desligamentos
        description: "Contagem de desligamentos (saldo_movimentacao = -1)"
        tests:
          - not_null
      - name: saldo_liquido
        description: "Admissões menos desligamentos"
        tests:
          - not_null
      - name: admissoes_com_salario_valido
        description: "Base do cálculo: admissões com unidade_salario_codigo=5 (mensal) e valor > 0"
      - name: salario_mediano_admissao
        description: "Salário mensal mediano na admissão (métrica robusta a outlier). NULL se 0 registros com salário válido."
      - name: salario_medio_admissao
        description: "Salário mensal médio na admissão (para comparação com mediana, mostra concentração). NULL se 0 registros com salário válido."
      - name: palma_index_admissao
        description: "Índice de desigualdade: média dos salários do top 10% dividida pela média dos salários do bottom 40%. Interpretação: Palma > 1 indica desigualdade (10% mais ricos ganham mais que os 40% mais pobres). NULL se insuficientes registros."

  - name: mart_caged_reconciliado
    description: >
      Saldo por competência de movimentação e grupamento reconciliado: MOV + FOR (fora do prazo)
      - EXC (exclusões). `situacao` distingue número provisório (ainda pode receber declarações
      fora do prazo) de consolidado (só exclusões tardias podem mexer). Salários ficam no
      mart_caged_mensal_grupamento. Ver F12 e D11.
    columns:
      - name: competencia_mov
        tests:
          - not_null
      - name: grupamento
        tests:
          - not_null
      - name: saldo_mov
        description: "Saldo só-MOV (declarado dentro do prazo). Deve bater com mart_caged_mensal_grupamento.saldo_liquido."
      - name: saldo_fora_prazo
        description: "Efeito do CAGEDFOR no saldo (soma)."
      - name: saldo_exclusoes
        description: "Efeito do CAGEDEXC no saldo: NEGATIVO quando uma admissão é excluída (o arquivo traz +1; aqui já vem invertido)."
      - name: saldo_consolidado
        description: "saldo_mov + saldo_fora_prazo + saldo_exclusoes."
      - name: defasagem_meses
        description: "Meses entre esta competência e a última competência carregada (ultima_competencia_carregada)."
      - name: situacao
        description: "'provisório' se defasagem_meses < meses_para_consolidar (padrão 12); senão 'consolidado' (não é imutável: exclusões tardias)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['provisório', 'consolidado']

  - name: ajuste_marco_zero
    description: >
      Ajuste calculado do marco zero (F16/D11): FOR/EXC que corrigem competências até a do
      marco e chegaram em arquivos posteriores a `retificacoes_ate`. Vazio em regime normal.
    columns:
      - name: territorio
        tests:
          - not_null
      - name: grupamento
        tests:
          - not_null
      - name: ajuste
        description: "Soma do efeito no saldo (FOR +saldo, EXC −saldo)."

  - name: mart_estoque
    description: >
      Estoque de emprego (estimativa a partir do marco zero) e taxa de variação mensal por
      território × grupamento × competência (F16/D11). Estoque e taxa ficam NULL antes do
      marco zero e em território sem marco zero; o saldo existe sempre.
    columns:
      - name: territorio
        tests:
          - not_null
      - name: grupamento
        tests:
          - not_null
      - name: competencia_mov
        tests:
          - not_null
      - name: saldo_consolidado
        description: "MOV + FOR − EXC da competência. Coincide com mart_caged_reconciliado.saldo_consolidado."
        tests:
          - not_null
      - name: estoque
        description: "marco zero + ajuste + saldos acumulados após o marco. NULL antes do marco ou sem marco."
      - name: taxa_variacao_mensal
        description: "saldo_consolidado ÷ estoque do mês anterior (fração). NULL sem estoque anterior ou com estoque 0."
      - name: competencia_marco_zero
        description: "Competência do marco zero do território (NULL se não houver)."

  - name: mart_fluxo
    description: >
      F19 parte 1. Admissões, desligamentos e saldo reconciliados (MOV + FOR − EXC) por
      território × competência × grupamento × subgrupamento × divisão CNAE (2 dígitos), para
      os territórios ativos. Mesma regra do estoque (efeito_no_saldo): somado por grupamento,
      é o saldo do mart_estoque. Base setorial do boletim com IA; nunca desce a subclasse.
    columns:
      - name: territorio
        tests: [not_null]
      - name: competencia_mov
        tests: [not_null]
      - name: grupamento
        tests: [not_null]
      - name: divisao_cnae
        description: "2 dígitos da CNAE 2.0; 'NI' = subclasse não identificada (9999999)"
        tests: [not_null]

  - name: mart_perfil_movimentacoes
    description: >
      F19 parte 1. Movimentações reconciliadas por território × competência, em duas
      dimensões independentes (sexo; faixa etária). As categorias de cada dimensão somam o
      total do mart_fluxo (test_perfil_confere_fluxo).
    columns:
      - name: dimensao
        tests:
          - accepted_values:
              arguments:
                values: ['sexo', 'faixa_etaria']
      - name: categoria
        tests: [not_null]

  - name: mart_estoque_regiao
    description: >
      F19 parte 1. Estoque e taxa de cada região de seeds/regioes.csv, como soma dos
      municípios membros no mart_estoque. Estoque NULL quando algum membro não tem estoque na
      competência (sem estoque parcial com cara de completo).

  - name: mart_salario_admissao
    description: >
      F19 parte 1. Salário de admissão (mediana e média) por território × competência, com
      as regras da D05 (só MOV, mensal, valor > 0). Mediana calculada sobre os registros, não
      a partir das medianas por grupamento.

unit_tests:
  - name: exclusao_de_admissao_reduz_estoque
    description: >
      Critério 6 da F16. Marco de 100 em 202003; em 202004 duas admissões no MOV e a
      exclusão de uma admissão (o EXC traz +1, o efeito é −1). Sem a exclusão seriam 102.
      A movimentação de 202003 não entra: o marco já a contém.
    model: mart_estoque
    given:
      - input: ref('territorios')
        rows:
          - {territorio: '280480', nome: 'Nossa Senhora do Socorro', tipo: 'municipio', ativo: true}
      - input: ref('stg_marco_zero_estoque')
        rows:
          - {territorio: '280480', grupamento: 'Indústria', estoque: 100, competencia_marco_zero: 202003, retificacoes_ate: 202607}
      - input: ref('ajuste_marco_zero')
        rows: []
      - input: ref('stg_caged_movimentacoes')
        rows:
          - {uf: 28, municipio: 280480, grupamento: 'Indústria', competencia_mov: 202003, saldo_movimentacao: 1}
          - {uf: 28, municipio: 280480, grupamento: 'Indústria', competencia_mov: 202004, saldo_movimentacao: 1}
          - {uf: 28, municipio: 280480, grupamento: 'Indústria', competencia_mov: 202004, saldo_movimentacao: 1}
      - input: ref('stg_caged_fora_do_prazo')
        rows: []
      - input: ref('stg_caged_exclusoes')
        rows:
          - {uf: 28, municipio: 280480, grupamento: 'Indústria', competencia_mov: 202004, competencia_arquivo: 202605, saldo_movimentacao: 1}
    expect:
      rows:
        - {territorio: '280480', grupamento: 'Indústria', competencia_mov: 202001, saldo_consolidado: 0, estoque: null}
        - {territorio: '280480', grupamento: 'Indústria', competencia_mov: 202002, saldo_consolidado: 0, estoque: null}
        - {territorio: '280480', grupamento: 'Indústria', competencia_mov: 202003, saldo_consolidado: 1, estoque: 100}
        - {territorio: '280480', grupamento: 'Indústria', competencia_mov: 202004, saldo_consolidado: 1, estoque: 101}

  - name: ajuste_ignora_o_que_o_painel_ja_incorporou
    description: >
      Duplo ajuste (D11). Duas declarações fora do prazo para 202002: a de 202601 já estava
      no painel quando o marco foi coletado (retificacoes_ate 202607) e não entra; a de
      202608 chegou depois e ajusta o marco. Uma de 202004 não é ajuste (entra no fluxo).
    model: ajuste_marco_zero
    given:
      - input: ref('territorios')
        rows:
          - {territorio: '280480', nome: 'Nossa Senhora do Socorro', tipo: 'municipio', ativo: true}
      - input: ref('stg_marco_zero_estoque')
        rows:
          - {territorio: '280480', grupamento: 'Comércio', estoque: 50, competencia_marco_zero: 202003, retificacoes_ate: 202607}
      - input: ref('stg_caged_movimentacoes')
        rows: []
      - input: ref('stg_caged_fora_do_prazo')
        rows:
          - {uf: 28, municipio: 280480, grupamento: 'Comércio', competencia_mov: 202002, competencia_arquivo: 202601, saldo_movimentacao: 1}
          - {uf: 28, municipio: 280480, grupamento: 'Comércio', competencia_mov: 202002, competencia_arquivo: 202608, saldo_movimentacao: -1}
          - {uf: 28, municipio: 280480, grupamento: 'Comércio', competencia_mov: 202004, competencia_arquivo: 202608, saldo_movimentacao: 1}
      - input: ref('stg_caged_exclusoes')
        rows: []
    expect:
      rows:
        - {territorio: '280480', grupamento: 'Comércio', linhas: 1, ajuste: -1}

  - name: territorios_por_municipio_e_por_uf
    description: >
      F16 parte 2. Socorro (município) e Sergipe (UF) ativos, Aracaju inativo. Uma admissão
      em Socorro e outra em Aracaju em 202004: Socorro soma 1, Sergipe soma as duas, Aracaju
      não aparece (inativo, mesmo com marco zero). Barra dos Coqueiros está ativa sem marco
      zero: tem fluxo e estoque NULL.
    model: mart_estoque
    given:
      - input: ref('territorios')
        rows:
          - {territorio: '280480', nome: 'Nossa Senhora do Socorro', tipo: 'municipio', ativo: true}
          - {territorio: '280030', nome: 'Aracaju', tipo: 'municipio', ativo: false}
          - {territorio: '280060', nome: 'Barra dos Coqueiros', tipo: 'municipio', ativo: true}
          - {territorio: '28', nome: 'Sergipe', tipo: 'uf', ativo: true}
      - input: ref('stg_marco_zero_estoque')
        rows:
          - {territorio: '280480', grupamento: 'Serviços', estoque: 10, competencia_marco_zero: 202003, retificacoes_ate: 202607}
          - {territorio: '280030', grupamento: 'Serviços', estoque: 50, competencia_marco_zero: 202003, retificacoes_ate: 202607}
          - {territorio: '28', grupamento: 'Serviços', estoque: 100, competencia_marco_zero: 202003, retificacoes_ate: 202607}
      - input: ref('ajuste_marco_zero')
        rows: []
      - input: ref('stg_caged_movimentacoes')
        rows:
          - {uf: 28, municipio: 280480, grupamento: 'Serviços', competencia_mov: 202004, saldo_movimentacao: 1}
          - {uf: 28, municipio: 280030, grupamento: 'Serviços', competencia_mov: 202004, saldo_movimentacao: 1}
          - {uf: 28, municipio: 280060, grupamento: 'Serviços', competencia_mov: 202004, saldo_movimentacao: -1}
      - input: ref('stg_caged_fora_do_prazo')
        rows: []
      - input: ref('stg_caged_exclusoes')
        rows: []
    expect:
      rows:
        - {territorio: '28', grupamento: 'Serviços', competencia_mov: 202001, saldo_consolidado: 0, estoque: null}
        - {territorio: '28', grupamento: 'Serviços', competencia_mov: 202002, saldo_consolidado: 0, estoque: null}
        - {territorio: '28', grupamento: 'Serviços', competencia_mov: 202003, saldo_consolidado: 0, estoque: 100}
        - {territorio: '28', grupamento: 'Serviços', competencia_mov: 202004, saldo_consolidado: 1, estoque: 101}
        - {territorio: '280060', grupamento: 'Serviços', competencia_mov: 202001, saldo_consolidado: 0, estoque: null}
        - {territorio: '280060', grupamento: 'Serviços', competencia_mov: 202002, saldo_consolidado: 0, estoque: null}
        - {territorio: '280060', grupamento: 'Serviços', competencia_mov: 202003, saldo_consolidado: 0, estoque: null}
        - {territorio: '280060', grupamento: 'Serviços', competencia_mov: 202004, saldo_consolidado: -1, estoque: null}
        - {territorio: '280480', grupamento: 'Serviços', competencia_mov: 202001, saldo_consolidado: 0, estoque: null}
        - {territorio: '280480', grupamento: 'Serviços', competencia_mov: 202002, saldo_consolidado: 0, estoque: null}
        - {territorio: '280480', grupamento: 'Serviços', competencia_mov: 202003, saldo_consolidado: 0, estoque: 10}
        - {territorio: '280480', grupamento: 'Serviços', competencia_mov: 202004, saldo_consolidado: 1, estoque: 11}
