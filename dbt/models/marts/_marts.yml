        - {territorio: '280480', grupamento: 'Comércio', competencia_mov: 202004, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Construção', competencia_mov: 202001, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Construção', competencia_mov: 202002, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Construção', competencia_mov: 202003, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Construção', competencia_mov: 202004, saldo_consolidado: 0, estoque: 0}
        - {territorio: '280480', grupamento: 'Indústria', competencia_mov: 202001, saldo_consolidado: 0, estoque: 99}
        - {territorio: '280480', grupamento: 'Indústria', competencia_mov: 202002, saldo_consolidado: 0, estoque: 99}
        - {territorio: '280480', grupamento: 'Indústria', competencia_mov: 202003, saldo_consolidado: 1, estoque: 100}
