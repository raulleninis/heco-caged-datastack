name: 'caged_analytics'
version: '1.0.0'
config-version: 2

require-dbt-version: ">=1.10.0"

profile: 'caged_analytics'

model-paths: ["models"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  caged_analytics:
    # staging: materialização definida por modelo via config() (a
    # stg_caged_movimentacoes é incremental — limite de memória em produção).
    marts:
      +materialized: table
